# Netlify: webversionen af FoodNow (til test via "Føj til hjemmeskærm")
[build]
  publish = "www"

[[headers]]
  for = "/billeder/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
